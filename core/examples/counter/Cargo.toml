[package]
name = "aegis-counter"
version = "0.1.0"
edition = "2021"
description = "The Aegis Core v0.1 proof: a complete counter app built on aegis-core"
license = "ISC"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
aegis-core = { path = "../../" }
borsh = { version = "1.8", default-features = false, features = ["derive"] }
solana-program = "2.3"
solana-sdk-ids = "2.2"
solana-system-interface = "1.0"

[dev-dependencies]
# No validator stack needed — the counter tests run the real handlers
# directly via solana_program's syscall stubs.

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = true

[lints.rust]
# solana-program's entrypoint! macro probes these cfgs; declaring them
# here silences the known check-cfg noise.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic"))',
] }
