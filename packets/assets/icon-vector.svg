<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EC4739"/>
      <stop offset="1" stop-color="#C92F24"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C42E24"/>
      <stop offset="1" stop-color="#A5221A"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBD06B"/>
      <stop offset="1" stop-color="#E5A32B"/>
    </linearGradient>
  </defs>

  <!-- app-icon rounded square -->
  <rect x="14" y="14" width="484" height="484" rx="112" fill="url(#body)"/>

  <!-- top flap folded down -->
  <path d="M56 92 L256 268 L456 92 L456 132 L256 300 L56 132 Z" fill="url(#flap)"/>

  <!-- inner pocket (cream) -->
  <path d="M84 168 L256 316 L428 168 L428 404 Q428 422 410 422 L102 422 Q84 422 84 404 Z" fill="#FFF3DC"/>

  <!-- front V flaps -->
  <path d="M84 168 L256 316 L256 422 L84 422 Z" fill="#E63F30" opacity="0.92"/>
  <path d="M428 168 L256 316 L256 422 L428 422 Z" fill="#D93325" opacity="0.92"/>

  <!-- gold seal -->
  <circle cx="256" cy="300" r="52" fill="url(#seal)"/>
  <circle cx="256" cy="300" r="38" fill="none" stroke="#C88A1F" stroke-width="5" opacity="0.55"/>
  <circle cx="256" cy="300" r="14" fill="#FFF7EC"/>
  <circle cx="250" cy="294" r="4" fill="#F5B842"/>

  <!-- sparkle -->
  <path d="M414 96 L420 116 L440 122 L420 128 L414 148 L408 128 L388 122 L408 116 Z" fill="#FBD06B"/>
  <circle cx="120" cy="392" r="6" fill="#FFF7EC" opacity="0.85"/>
</svg>
